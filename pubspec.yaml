name: pulso_basket
description: >-
  Pulso Basket: seguimiento GPS de carrera y bicicleta 100 % offline para
  jugadores de baloncesto, con rutina de fuerza semanal sobre colchoneta,
  historial permanente y control desde la pantalla de bloqueo.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Estado reactivo (sin generadores de código)
  flutter_riverpod: ^2.5.1

  # GPS nativo + background (geolocator ya gestiona permisos)
  geolocator: ^12.0.0

  # Persistencia local (offline, permanente)
  sqflite: ^2.3.3
  path: ^1.9.0

  # Gráficas
  fl_chart: ^0.68.0

  # Utilidades
  intl: ^0.19.0
  wakelock_plus: ^1.2.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
